<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry River Rafting Co.</title>
    <meta name="description" content="Contact White Water Rafting Company for inquiries, reservations, or suggestions. Find our address, phone number, location map, and team profiles.">
    <meta name="author" content="Bamidele Olusola">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting Company Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Company Information Header -->
        <section class="company-info">
            <h1>Dry River Rafting Co.</h1>
            <address>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
                <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </address>
        </section>

        <!-- Map & Contact Form Side-by-Side Section -->
        <section class="map-form-container">
            <!-- Left: Google Map -->
            <div class="map-wrapper">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!0f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064bf59f6f3%3A0x4012920216149455!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" 
                    width="600" 
                    height="450" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade" 
                    title="White Water Rafting Location Map">
                </iframe>
            </div>

            <!-- Right: Contact Form -->
            <form action="#" method="post" class="contact-form">
                
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <div class="form-row radio-group">
                    <span class="label-heading">Message Purpose</span>
                    <div class="radio-options">
                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="form-row checkbox-row">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <!-- Employee Profiles Section -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Dry River Rafting Co. | Bamidele Olusola</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
